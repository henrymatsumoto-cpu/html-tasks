<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ConcertAI · Protótipo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --brand:#0055FF;--brand-hover:#0044CC;--brand-100:#E8F0FE;--brand-200:#C7DBFF;
  --navy:#080E32;--navy-2:#00143D;--navy-3:#182052;
  --coral:#F1605D;--coral-hover:#DE5141;--coral-press:#D4403B;--coral-100:#FFE4E3;
  --bg:#F6F7F9;--surface:#FFFFFF;--muted:#F3F3F5;--border:#E6E7EA;--border-strong:#E1E2E5;
  --fg:#080E32;--fg-2:#595D6C;--fg-3:#7D7D80;--fg-on-dark:#FFFFFF;--fg-on-dark-2:#B8BCD6;
  --success:#22C55E;--success-100:#E7F8EE;--success-ink:#15803D;
  --warning:#F54A00;--warning-100:#FFF0E8;--error:#E7000B;--error-100:#FDE7E8;
  --stay-fill:#C7DBFF;--stay-bar:#0055FF;--visit-fill:#FFE4E3;--visit-dot:#F1605D;--visit-ink:#AD2720;
  --shadow-card:0 1px 2px -1px #02061714,0 1px 3px #0206170f;
  --shadow-raise:0 0 6px -4px rgba(0,0,0,.1),0 4px 15px -3px rgba(0,0,0,.1);
  --shadow-modal:0 8px 40px rgba(0,0,0,.12);
  --ring:0 0 0 3px rgba(0,85,255,.35);
  --ease:150ms cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#060A24;--surface:#0E1438;--muted:#151C45;--border:#232B5C;--border-strong:#2C356B;
  --fg:#F2F3F8;--fg-2:#A9AECB;--fg-3:#7E84A8;
  --brand:#3D7BFF;--brand-hover:#5C90FF;--brand-100:#13235C;--brand-200:#1C3378;
  --coral:#FF6F6B;--coral-hover:#FF8582;--coral-100:#3A1A2A;
  --stay-fill:#1C3378;--stay-bar:#5C90FF;--visit-fill:#3A1A2A;--visit-dot:#FF6F6B;--visit-ink:#FFB4B1;
  --success-100:#0F2E22;--success-ink:#4ADE80;--warning-100:#33190D;--error-100:#360B14;
  --shadow-card:0 1px 2px rgba(0,0,0,.4);--shadow-raise:0 6px 20px rgba(0,0,0,.45);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#060A24;--surface:#0E1438;--muted:#151C45;--border:#232B5C;--border-strong:#2C356B;
  --fg:#F2F3F8;--fg-2:#A9AECB;--fg-3:#7E84A8;
  --brand:#3D7BFF;--brand-hover:#5C90FF;--brand-100:#13235C;--brand-200:#1C3378;
  --coral:#FF6F6B;--coral-hover:#FF8582;--coral-100:#3A1A2A;
  --stay-fill:#1C3378;--stay-bar:#5C90FF;--visit-fill:#3A1A2A;--visit-dot:#FF6F6B;--visit-ink:#FFB4B1;
  --success-100:#0F2E22;--success-ink:#4ADE80;--warning-100:#33190D;--error-100:#360B14;
  --shadow-card:0 1px 2px rgba(0,0,0,.4);--shadow-raise:0 6px 20px rgba(0,0,0,.45);color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{font-family:Inter,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:24px;color:var(--fg);background:var(--bg);min-height:100vh;overflow-x:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:none;box-shadow:var(--ring)}
.tn{font-feature-settings:"tnum"}
svg.lucide{width:20px;height:20px;stroke-width:1.75;flex:none}
.i14 svg.lucide,svg.lucide.i14{width:14px;height:14px}
.app{max-width:480px;margin:0 auto;padding-bottom:180px;min-height:100vh}
.wrap{padding:0 16px}
/* header */
.top{position:sticky;top:0;z-index:20;height:64px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--surface);box-shadow:var(--shadow-card)}
.top.over{position:absolute;left:0;right:0;background:transparent;box-shadow:none;color:#fff}
.logo{display:flex;align-items:center;gap:10px;font-weight:600}
.wm{font-size:22px;font-weight:800;letter-spacing:-.03em;color:var(--navy)}.wm span{color:var(--coral)}.top.over .wm,:root[data-theme="dark"] .wm{color:#fff}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wm{color:#fff}}
.logo .sep{width:1px;height:20px;background:var(--border)}
.top.over .logo .sep{background:rgba(255,255,255,.35)}
.top .who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;line-height:20px;font-weight:600;min-width:0}
.top .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.av{width:36px;height:36px;border-radius:50%;background:var(--brand-200);color:var(--navy);display:grid;place-items:center;font-size:13px;font-weight:700;flex:none}
.av.lg{width:48px;height:48px;font-size:16px}
.av.ok{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--success)}
/* tabs */
.tabs{display:flex;gap:8px;padding:12px 16px;overflow-x:auto;scrollbar-width:none}
.tab{height:36px;padding:0 16px;border-radius:9999px;font-size:14px;font-weight:600;color:var(--fg-2);background:var(--surface);box-shadow:var(--shadow-card);white-space:nowrap;display:flex;align-items:center;gap:6px;transition:background var(--ease),color var(--ease)}
.tab[aria-selected="true"]{background:var(--brand);color:#fff}
.tab .ct{min-width:20px;height:20px;border-radius:9999px;background:var(--brand-100);color:var(--brand);font-size:12px;line-height:20px;padding:0 6px}
.tab[aria-selected="true"] .ct{background:rgba(255,255,255,.25);color:#fff}
/* hero */
.hero{position:relative;height:420px;color:#fff;overflow:hidden;background:var(--navy)}
.hero img.bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(8,14,50,.95) 0%,rgba(8,14,50,.6) 50%,rgba(8,14,50,.2) 100%)}
.hero .in{position:absolute;left:16px;right:16px;bottom:32px;z-index:1;display:flex;flex-direction:column;gap:16px}
.chip-w{align-self:flex-start;background:rgba(255,255,255,.14);font-size:12px;line-height:16px;font-weight:600;padding:6px 12px;border-radius:9999px}
.hero h1{font-size:32px;line-height:36px;font-weight:800;letter-spacing:-.02em}
.search{height:56px;border-radius:9999px;background:var(--surface);box-shadow:var(--shadow-raise);display:flex;align-items:center;gap:10px;padding:0 20px;color:var(--fg-3)}
.search input{flex:1;border:0;background:none;font:inherit;color:var(--fg);min-width:0;outline:none}
.hero .nx{font-size:14px;line-height:20px;color:var(--fg-on-dark-2);display:flex;gap:6px;align-items:center}
/* type */
h2.sec{font-size:22px;line-height:28px;font-weight:700;margin:32px 0 12px}
h3{font-size:18px;line-height:24px;font-weight:700}
.sub{font-size:14px;line-height:20px;color:var(--fg-2)}
.cap{font-size:12px;line-height:16px;font-weight:500;color:var(--fg-2)}
.code{font-size:12px;color:var(--fg-3);font-weight:500}
/* categories */
.cats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px 8px;margin-top:24px}
.cat{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;line-height:16px;font-weight:600;text-align:center;color:var(--fg)}
.cat .ci{width:56px;height:56px;border-radius:50%;background:var(--brand-100);color:var(--brand);display:grid;place-items:center;transition:transform var(--ease),background var(--ease)}
.cat .ci svg{width:28px;height:28px}
.cat[aria-pressed="true"] .ci{background:var(--brand);color:#fff}
.mline{display:flex;gap:8px;align-items:center;font-size:12px;line-height:16px;font-weight:500;color:var(--fg-2);background:var(--muted);border-radius:12px;padding:8px 12px;margin-top:16px}
/* service card */
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border-radius:12px;box-shadow:var(--shadow-card);padding:16px}
.svc{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;transition:transform var(--ease),box-shadow var(--ease);cursor:pointer}
@media (hover:hover){.svc:hover,.pro:hover{transform:translateY(-2px);box-shadow:var(--shadow-raise)}}
.svc .nm{font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.svc .ds{font-size:14px;line-height:20px;color:var(--fg-2);margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px}
.meta span{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:16px;font-weight:500;color:var(--fg-2)}
.meta svg.lucide{width:14px;height:14px}
.pr{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.pr .ap{font-size:12px;line-height:16px;color:var(--fg-2)}
.pr b{font-size:20px;line-height:24px;font-weight:700;font-feature-settings:"tnum"}
.plus{width:36px;height:36px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;transition:background var(--ease),transform 200ms}
.plus:hover{background:var(--coral-hover)}.plus:active{transform:scale(.94)}
.added{height:36px;border-radius:9999px;background:var(--coral-100);color:var(--visit-ink);display:flex;align-items:center;gap:6px;padding:0 12px;font-size:14px;font-weight:600}
/* buttons */
.btn{height:44px;padding:0 20px;border-radius:9999px;font-size:15px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background var(--ease),transform var(--ease)}
.btn:active{transform:scale(.98)}
.btn.cta{background:var(--coral);color:#fff;height:52px;font-size:16px;font-weight:700;width:100%}
.btn.cta:hover{background:var(--coral-hover)}
.btn.cta[disabled]{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand-hover)}
.btn.out{box-shadow:inset 0 0 0 1px var(--border-strong);background:var(--surface)}
.btn.sm{height:36px;padding:0 14px;font-size:14px}
.btn.w{width:100%}
.lnk{color:var(--brand);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:4px}
/* cart bar */
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;pointer-events:none}
.cartbar .in{pointer-events:auto;width:100%;max-width:480px;height:72px;background:var(--navy);color:#fff;display:flex;align-items:center;gap:12px;padding:0 16px;box-shadow:var(--shadow-raise);border-radius:16px 16px 0 0}
.cartbar .tt{flex:1;min-width:0}
.cartbar .tt b{font-size:18px;line-height:22px;display:block}
.cartbar .tt span{font-size:12px;line-height:16px;color:var(--fg-on-dark-2)}
.cartbar .btn.cta{width:auto;height:48px;padding:0 20px;font-size:15px}
.bump{animation:bump 180ms}
@keyframes bump{50%{transform:scale(1.04)}}
/* step header */
.steph{display:flex;align-items:center;gap:12px;padding:16px 16px 8px}
.back{width:40px;height:40px;border-radius:50%;background:var(--surface);box-shadow:var(--shadow-card);display:grid;place-items:center;flex:none}
.steph h1{font-size:22px;line-height:28px;font-weight:700}
.dots{display:flex;gap:4px;padding:0 16px 16px}
.dots i{height:4px;flex:1;border-radius:9999px;background:var(--border-strong)}
.dots i.on{background:var(--brand)}
/* pro card */
.pro{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;position:relative;cursor:pointer;transition:transform var(--ease),box-shadow var(--ease)}
.pro .n{font-weight:600;display:flex;align-items:center;gap:4px}
.pro .n svg{color:var(--brand);width:16px;height:16px}
.pro .r{display:flex;align-items:center;gap:4px;font-size:14px;line-height:20px;color:var(--fg-2)}
.star{color:var(--coral);fill:var(--coral);width:14px!important;height:14px!important}
.okchip{display:inline-block;margin-top:6px;background:var(--success-100);color:var(--success-ink);font-size:12px;line-height:16px;font-weight:600;padding:2px 8px;border-radius:9999px}
.pro .wnd{font-size:14px;line-height:20px;font-weight:600;text-align:right}
.sel{box-shadow:inset 0 0 0 2px var(--brand),var(--shadow-card)}
.sel .chk{position:absolute;top:-8px;right:-8px;color:var(--brand);background:var(--surface);border-radius:50%}
/* calendar */
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calh b{font-size:16px;text-transform:capitalize}
.calh button{width:36px;height:36px;border-radius:50%;display:grid;place-items:center}
.calh button[disabled]{opacity:.3}
.cal{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px}
.cal .dw{font-size:12px;line-height:16px;font-weight:600;color:var(--fg-3);text-align:center;padding-bottom:4px}
.day{position:relative;height:52px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;font-size:14px;font-weight:500;font-feature-settings:"tnum"}
.day .nb{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;position:relative;z-index:1;transition:background 120ms}
.day.dis{color:var(--fg-3);opacity:.4;cursor:default}
.day.today .nb{box-shadow:inset 0 0 0 1px var(--fg)}
.day.on .nb{background:var(--brand);color:#fff}
.day.stay:before{content:"";position:absolute;left:0;right:0;bottom:2px;height:16px;background:color-mix(in srgb,var(--stay-fill) 40%,transparent)}
.day.stay:after{content:"";position:absolute;left:0;right:0;bottom:2px;height:6px;background:var(--stay-bar)}
.day.s0:before,.day.s0:after{left:6px;border-radius:9999px 0 0 9999px}
.day.s1:before,.day.s1:after{right:6px;border-radius:0 9999px 9999px 0}
.day .bed{position:absolute;left:2px;bottom:0;width:14px;height:14px;border-radius:50%;background:var(--stay-bar);color:#fff;display:grid;place-items:center;z-index:2}
.day .bed svg{width:10px;height:10px}
.day .dot{position:absolute;bottom:9px;width:6px;height:6px;border-radius:50%;background:var(--visit-dot);z-index:1}
.legend{display:flex;gap:16px;margin-top:8px}
.legend span{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:500;color:var(--fg-2)}
.legend i{display:inline-block}
.info{display:flex;gap:8px;align-items:flex-start;background:var(--brand-100);color:var(--fg);border-radius:12px;padding:12px;font-size:14px;line-height:20px;margin-top:12px}
.info svg{color:var(--brand)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.slot{height:40px;border-radius:9999px;font-size:14px;font-weight:600;font-feature-settings:"tnum";background:var(--surface);box-shadow:inset 0 0 0 1px var(--border-strong);display:flex;align-items:center;justify-content:center;gap:4px;transition:background 120ms,color 120ms}
.slot.on{background:var(--brand);color:#fff;box-shadow:none}
.slot[disabled]{color:var(--fg-3);text-decoration:line-through;box-shadow:none;background:transparent;cursor:not-allowed}
.slot .bd{width:6px;height:6px;border-radius:50%;background:var(--stay-bar)}
.slot.on .bd{background:#fff}
/* summary */
.sumrow{display:flex;justify-content:space-between;gap:12px;font-size:14px;line-height:20px;padding:6px 0}
.sumrow .l{min-width:0}
.sumrow.tot{font-size:24px;line-height:30px;font-weight:700;border-top:1px solid var(--border);margin-top:8px;padding-top:12px}
.mat{display:flex;gap:12px;align-items:flex-start;background:var(--muted);border-radius:12px;padding:12px;margin:16px 0}
.mat svg{color:var(--fg-2)}
.mat b{font-size:14px;line-height:20px;display:block}
.mat p{font-size:14px;line-height:20px;color:var(--fg-2)}
.warnbox{display:flex;gap:8px;align-items:flex-start;background:var(--warning-100);border-radius:12px;padding:12px;font-size:14px;line-height:20px}
.warnbox svg{color:var(--warning)}
.imgrow{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.imgrow img,.imgrow .fb{width:64px;height:64px;border-radius:12px;object-fit:cover;flex:none}
.fb{background:var(--brand-100);color:var(--brand);display:grid;place-items:center}
.fb svg{width:32px;height:32px}
/* done */
.done{background:var(--navy);color:#fff;min-height:100vh;padding:48px 16px 140px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.done .ok{width:88px;height:88px;border-radius:50%;background:var(--success);display:grid;place-items:center}
.done .ok svg{width:44px;height:44px;color:#fff;stroke-width:2.5}
.done h1{font-size:28px;line-height:34px;font-weight:800}
.done .card{color:var(--fg);text-align:left;width:100%}
.steps3{width:100%;text-align:left;display:flex;flex-direction:column;gap:12px;margin-top:8px}
.steps3 div{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:20px;color:var(--fg-on-dark-2)}
.steps3 i{width:24px;height:24px;border-radius:50%;background:var(--brand-200);color:var(--navy);font-style:normal;font-weight:700;font-size:12px;display:grid;place-items:center;flex:none}
/* orders */
.ord{display:flex;flex-direction:column;gap:12px}
.ord .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.badge{font-size:12px;line-height:16px;font-weight:600;padding:4px 10px;border-radius:9999px;white-space:nowrap}
.b-ok{background:var(--success-100);color:var(--success-ink)}
.b-ap{background:var(--warning-100);color:var(--warning)}
.b-in{background:var(--brand-100);color:var(--brand)}
.b-no{background:var(--muted);color:var(--fg-3)}
.vis{display:inline-flex;align-items:center;gap:6px;font-size:12px;line-height:16px;font-weight:600;background:var(--visit-fill);color:var(--visit-ink);padding:4px 10px;border-radius:9999px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.tl{display:flex;flex-direction:column;gap:0;position:relative;margin-top:4px}
.tl div{display:flex;gap:12px;align-items:center;font-size:14px;line-height:20px;padding:6px 0;position:relative;color:var(--fg-3)}
.tl div:not(:last-child):after{content:"";position:absolute;left:7px;top:22px;bottom:-10px;width:2px;background:var(--border)}
.tl .pt{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--border-strong)}
.tl .d .pt{background:var(--success)}.tl .d .pt svg{width:10px;height:10px;color:#fff;stroke-width:3}
.tl .d{color:var(--fg)}
.tl .c{color:var(--fg);font-weight:700}
.tl .c .pt{background:var(--brand);box-shadow:0 0 0 5px var(--brand-100)}
.divider{height:1px;background:var(--border)}
.note{font-size:14px;line-height:20px;color:var(--fg-2)}
/* notif */
.ntf{display:flex;gap:12px;align-items:flex-start}
.ntf .ic{width:40px;height:40px;border-radius:50%;background:var(--brand-100);color:var(--brand);display:grid;place-items:center;flex:none}
.ntf.new .ic{background:var(--coral-100);color:var(--coral)}
.ntf b{font-size:14px;line-height:20px;display:block}
/* agent */
.agent{background:var(--navy);color:#fff;border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:8px}
.agent .t{display:flex;align-items:center;gap:8px;font-weight:700}
.agent p{font-size:14px;line-height:20px;color:var(--fg-on-dark-2)}
.sug{display:flex;flex-direction:column;gap:12px}
.sug .tx{font-size:15px;line-height:22px}
.sug .tx b{font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.kpi b{font-size:28px;line-height:34px;font-weight:800;font-feature-settings:"tnum";display:block}
.kpi span{font-size:12px;line-height:16px;font-weight:500;color:var(--fg-2)}
/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(8,14,50,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade 220ms}
.sheet{background:var(--surface);width:100%;max-width:480px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;box-shadow:var(--shadow-modal);padding:8px 16px 24px;animation:up 220ms cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:4px;border-radius:9999px;background:var(--border-strong);margin:4px auto 12px}
.sheet h2{font-size:22px;line-height:28px;font-weight:700}
.sheet ul{list-style:none;display:flex;flex-direction:column;gap:6px;margin-top:6px}
.sheet li{display:flex;gap:8px;font-size:14px;line-height:20px}
.sheet li svg{width:16px;height:16px;margin-top:2px}

@keyframes fade{from{opacity:0}}
/* pill + toast */
.pill{position:fixed;left:12px;bottom:16px;z-index:40;display:flex;align-items:center;gap:2px;height:36px;padding:0 4px 0 10px;border-radius:9999px;background:rgba(8,14,50,.9);color:#fff;font-size:12px;line-height:16px;box-shadow:var(--shadow-raise);transition:bottom var(--ease)}
body.hascart .pill{bottom:84px}
.pill .lb{color:var(--fg-on-dark-2);margin-right:2px;white-space:nowrap;display:flex;align-items:center;gap:4px}.pill .lb svg{width:14px;height:14px}@media (max-width:480px){.pill .lbt{display:none}.pill button{padding:0 8px}}
.pill button{height:28px;padding:0 10px;border-radius:9999px;font-weight:600;white-space:nowrap}
.pill button[aria-pressed="true"]{background:#fff;color:var(--navy)}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:var(--navy);color:#fff;font-size:14px;font-weight:600;padding:10px 18px;border-radius:9999px;box-shadow:var(--shadow-raise);opacity:0;pointer-events:none;transition:opacity 200ms;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1}
body.hascart .toast{bottom:160px}
.empty{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:32px 16px}
.empty .c{width:80px;height:80px;border-radius:50%;background:var(--brand-100);color:var(--brand);display:grid;place-items:center}
.empty .c svg{width:36px;height:36px}
.gap8{display:flex;flex-direction:column;gap:8px}.gap16{display:flex;flex-direction:column;gap:16px}
.sel-imv{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;cursor:pointer}
.sel-imv img,.sel-imv .fb{width:56px;height:56px;border-radius:12px;object-fit:cover}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mt24{margin-top:24px}
@media (min-width:960px){.app{padding-top:8px}.cats{grid-template-columns:repeat(8,1fr)}}
@media (prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

ha: conserta e testa.","inc":["Reparo de fusível, botão ou trava da porta","Teste"],"exc":["Troca de magnetron","Troca de placa"],"dur":"45 a 60 min","jan":1},{"cod":"MA-01","nome":"Ajuste de porta, dobradiça ou trilho","preco":225,"desc":"Porta arrastando, caída ou sem fechar: ajusta e deixa fechando bem.","inc":["Regulagem da porta","Troca de dobradiça ou roldana","Plaina quando precisar"],"exc":["Porta nova","Batente novo"],"dur":"45 a 60 min","jan":1},{"cod":"MA-02","nome":"Conserto simples de móvel","preco":230,"desc":"Conserta mecanismo de sofá, braço solto ou gaveta com problema.","inc":["Reaperto e cola","Troca de corrediça ou mecanismo simples"],"exc":["Reforma do móvel","Troca de estofado"],"dur":"45 a 60 min","jan":1},{"cod":"VI-02","nome":"Conserto de box do banheiro","preco":265,"desc":"Box que não corre, vaza ou está sem puxador: regula e troca as peças.","inc":["Regulagem","Troca de roldana, vedação ou puxador"],"exc":["Vidro novo","Box novo"],"dur":"45 a 60 min","jan":1},{"cod":"VI-03","nome":"Pequeno conserto em janela ou vidraça","preco":225,"desc":"Conserta fecho, vedação, silicone ou puxador de janela e vidraça.","inc":["Reparo no local","Troca de fecho, vedação ou puxador"],"exc":["Vidro novo","Esquadria nova"],"dur":"45 a 60 min","jan":1}];

function resOf(code,n){ const im=imv(code); for(const [a,b] of im.res){ if(n>=a&&n<=b) return {a,b}; } return null; }
function guestAt(code,n,h,min){ // janela cruza estadia? check-out 11h, check-in 15h
  const im=imv(code); const s=h*60,e=s+min;
  return im.res.some(([a,b])=> (n>a&&n<b) || (n===a&&e>15*60) || (n===b&&s<11*60));
}
function proBusy(p,n,h,min,skip){
  const idx=PROS.indexOf(p);
  if(addD(n).getDay()===0) return true;
  for(let t=h*60;t<h*60+min;t+=60){ const hh=Math.floor(t/60); if((n*7+hh*3+idx*5)%6===0) return true; }
  return S.orders.some(o=>o.id!==skip&&o.pro===p.id&&o.dia===n&&o.status!=="recusado"&&h*60<o.h*60+o.min&&o.h*60<h*60+min);
}
function nextSlot(p,min,from,prefH){
  for(let n=from;n<=40;n++){
    const hs=[]; for(let h=8;h<=16;h++) hs.push(h);
    if(prefH) hs.sort((a,b)=>(a<prefH)-(b<prefH)||a-b);
    for(const h of hs) if(!proBusy(p,n,h,min)) return {n,h};
  }
  return null;
}

function newFlow(b){ return {buyer:b,step:b==="fra"?0:1,imovel:b==="prop"?"FLN0412":null,itens:[],cat:"",q:"",pro:null,dia:null,h:null,month:0,done:null}; }

function vBuyer(b){
  const f=flow();
  const aprov=S.orders.filter(o=>o.status==="aprovacao"&&o.buyer==="fra"&&(b==="prop"?o.imovel==="FLN0412":true)).length;
  const mat=S.orders.filter(o=>o.material&&o.material.st==="pendente"&&o.buyer===b).length;
  const novos=S.notifs.filter(n=>n.novo).length;
  const tl=[["comprar","Contratar"],["pedidos","Pedidos",(b==="prop"?aprov:0)+mat||""]];
  if(b==="fra") tl.push(["avisos","Avisos",novos||""]);
  const t=S.tab[b];
  if(t==="pedidos") return header()+tabs(tl)+vPedidos(b);
  if(t==="avisos") return header()+tabs(tl)+vAvisos();
  if(f.done) return vDone(f);
  if(f.step===0) return header()+tabs(tl)+stepImovel(f);
  if(f.step===1) return (b==="prop"?heroProp(f)+tabs(tl):header()+tabs(tl)+imvBar(f))+catalogo(f);

}
const STOP=new Set(["de","do","da","no","na","com","sem","o","a","e","que","não","nao","meu","minha"]);
function filtra(f){
  const toks=f.q.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").split(/\s+/).filter(t=>t.length>2&&!STOP.has(t));
  return ITENS.filter(i=>{
    if(f.cat&&i.cat!==f.cat) return false;
    if(!toks.length) return true;
    const hay=(i.nome+" "+i.desc+" "+CATS[i.cat][0]).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
    return toks.some(t=>hay.includes(t.slice(0,5)));
  });
}

function stepData(f){
  const min=fMin(f), p=pro(f.pro);
  const base=new Date(TODAY.getFullYear(),TODAY.getMonth()+f.month,1);
  const first=base.getDay(), dim=new Date(base.getFullYear(),base.getMonth()+1,0).getDate();
  let cells=""; for(let i=0;i<first;i++) cells+=`<span></span>`;
  for(let d=1;d<=dim;d++){
    const n=dOff(new Date(base.getFullYear(),base.getMonth(),d));
    const dis=n<1||n>45||addD(n).getDay()===0;
    const r=resOf(f.imovel,n);
    const cls=["day"]; if(dis) cls.push("dis"); if(n===0) cls.push("today"); if(f.dia===n) cls.push("on");
    if(r){cls.push("stay"); if(n===r.a) cls.push("s0"); if(n===r.b) cls.push("s1");}
    const has=S.orders.some(o=>o.imovel===f.imovel&&o.dia===n&&o.status!=="recusado");
    cells+=`<button class="${cls.join(" ")}" ${dis?"disabled":""} data-dia="${n}" aria-label="${fmtD(n)}${r?", tem hóspede":""}${has?", tem agenda":""}" aria-pressed="${f.dia===n}"><span class="nb">${d}</span>${r&&n===r.a?`<span class="bed">${ic("bed-double")}</span>`:""}${has?`<span class="dot"></span>`:""}</button>`;
  }
  let slots="";
  if(f.dia!=null){
    for(let h=8;h<=16;h++){
      const busy=proBusy(p,f.dia,h,min); const g=guestAt(f.imovel,f.dia,h,min);
      slots+=`<button class="slot ${f.h===h?"on":""}" ${busy?"disabled":""} data-h="${h}" ${g?`title="Entra durante a estadia"`:""} aria-pressed="${f.h===h}">${g&&!busy?`<span class="bd"></span>`:""}${janela(h,min)}</button>`;
    }
  }
  const r=f.dia!=null&&resOf(f.imovel,f.dia);
  return stepHead(f,"Data e horário",3)+`<div class="wrap gap16">
    <div class="card">
      <div class="calh"><button data-mes="-1" ${f.month<=0?"disabled":""} aria-label="Mês anterior">${ic("chevron-left")}</button><b>${MES[base.getMonth()]} ${base.getFullYear()}</b><button data-mes="1" ${f.month>=1?"disabled":""} aria-label="Próximo mês">${ic("chevron-right")}</button></div>
      <div class="cal">${["D","S","T","Q","Q","S","S"].map(x=>`<span class="dw">${x}</span>`).join("")}${cells}</div>
      <div class="legend"><span><i style="width:16px;height:6px;border-radius:9999px;background:var(--stay-bar)"></i>Reserva</span><span><i style="width:6px;height:6px;border-radius:50%;background:var(--visit-dot)"></i>Tem agenda</span></div>
      ${r?`<div class="info">${ic("info")}<span><b>Tem hóspede nesse dia.</b> O profissional combina o acesso com a operação.</span></div>`:""}
    </div>
    ${f.dia!=null?`<div><h3 style="font-size:16px">Horário</h3><p class="sub">Duração estimada: ${durLbl(min)} · com ${p.nome}</p><div class="slots">${slots}</div></div>`:`<p class="sub">Escolha um dia para ver os horários de ${p.nome}.</p>`}
  </div>`;
}

  if(d.close&&e.target===t){ closeSheet(); return; }
  if(d.perfil){ S.perfil=d.perfil; if(d.perfil==="prest"){ const nv=S.orders.filter(o=>o.status==="ok"&&o.step===0).pop(); if(nv) S.prest=nv.pro; } closeSheet(); render(); return; }
  if(d.tab){ S.tab[S.perfil]=d.tab; if(d.tab==="avisos") setTimeout(()=>S.notifs.forEach(n=>n.novo=false),0); render(); return; }
  if(d.add||d.rem){
    e.stopPropagation(); const fl=flow();
    if(d.add&&!fl.itens.includes(d.add)){ fl.itens.push(d.add); toast("Serviço adicionado"); }
    if(d.rem) fl.itens=fl.itens.filter(x=>x!==d.rem);
    fl.pro=null; fl.dia=null; fl.h=null;
    if(d.closeAfter) closeSheet();
    render(true); const cb=$("#cb"); if(cb&&d.add){ cb.classList.remove("bump"); void cb.offsetWidth; cb.classList.add("bump"); }
    return;
  }
  if(d.det){ detalhe(d.det); return; }
  if(d.cat!==undefined&&t.classList.contains("cat")){ f.cat=f.cat===d.cat?"":d.cat; render(true); return; }
  if(d.imv){ f.imovel=d.imv; f.step=1; render(); return; }
  if(d.pro){ f.pro=d.pro; f.dia=null; f.h=null; render(true); return; }
  if(d.mes){ f.month+=Number(d.mes); render(true); return; }
  if(d.dia!==undefined&&t.classList.contains("day")){ f.dia=Number(d.dia); f.h=null; render(true); return; }
  if(d.h){ f.h=Number(d.h); render(true); return; }
  if(d.ap||d.rec){ const o=S.orders.find(x=>x.id===(d.ap||d.rec)); if(d.ap){ o.status="ok"; o.step=0; notifVisita(o); toast("Aprovado. A franquia foi avisada"); } else { o.status="recusado"; toast("Recusado. A franquia foi avisada"); } render(true); return; }
  if(d.mat){ const o=S.orders.find(x=>x.id===d.mat); o.material.st=d.v==="1"?"aprovado":"recusado"; toast(d.v==="1"?"Material aprovado":"Material recusado"); render(true); return; }
  if(d.prest){ S.prest=d.prest; render(true); return; }
  if(d.adv){ const o=S.orders.find(x=>x.id===d.adv); o.step=Math.min(o.step+1,4); toast(STEPS[o.step]); render(true); return; }
  if(d.pmat){ matSheet(d.pmat); return; }
  if(d.pmatv){ const o=S.orders.find(x=>x.id===d.pmatv); o.material={v:Number(d.v),d:d.d,st:"pendente"}; closeSheet(); toast("Enviado para o comprador aprovar"); render(true); return; }
  if(d.contr||d.ign){
    const m=S.manut.find(x=>x.id===(d.contr||d.ign)); m.done=true;
    if(d.contr){ const {p,i,s}=sugestao(m); const ap=i.preco>LIMITE;
      const o={id:"PED-"+(seq++),buyer:"fra",imovel:m.imovel,itens:[i.cod],pro:p.id,dia:s.n,h:s.h,min:i.min,total:i.preco,status:ap?"aprovacao":"ok",step:0};
      S.orders.push(o); if(!ap) notifVisita(o);
      toast(ap?`${o.id} enviado ao proprietário para aprovar`:`${o.id} contratado · franquia avisada`);
    } else toast("Sugestão ignorada");
    render(true); return;
  }
  switch(d.act){
    case "avancar": if(f.step===1&&!prosFor(f).length){ f.step=2; } else f.step++; render(); break;
    case "voltar": f.step--; if(f.buyer==="prop"&&f.step<1) f.step=1; render(); break;
    case "confirmar": confirmar(f); break;
    case "novo": S.flow[S.perfil]=newFlow(S.perfil); render(); break;
    case "verPedidos": S.flow[S.perfil]=newFlow(S.perfil); S.tab[S.perfil]="pedidos"; render(); break;
    case "trocaImv": f.step=0; render(); break;
    case "limpa": f.q=""; f.cat=""; render(true); break;
  }
});
document.addEventListener("keydown",e=>{
  if(e.key==="Escape") closeSheet();
  const c=e.target.closest&&e.target.closest("[data-det]");
  if(c&&(e.key==="Enter"||e.key===" ")&&e.target===c){ e.preventDefault(); detalhe(c.dataset.det); }
});
document.addEventListener("input",e=>{
  if(e.target.id!=="q") return;
  const f=flow(); f.q=e.target.value;
  const L=filtra(f); const el=$("#lista");
  if(el){ el.innerHTML=L.length?L.map(i=>svcCard(i,f)).join(""):`<div class="empty"><span class="c">${ic("search-x")}</span><h3>Nada com esse nome</h3><p class="sub">Tente “chuveiro”, “tomada” ou “porta”.</p><button class="btn pri sm" data-act="limpa">Ver todos</button></div>`; icons(); }
});
render();
</script>
</body>
</html>
