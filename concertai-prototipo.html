<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ConcertAI · Protótipo</title>
<meta name="description" content="Protótipo navegável do ConcertAI: serviços avulsos e kits de manutenção para proprietário e franquia, descontados do repasse. Dados fictícios.">
<style>
:root{
  --color-primary:#0055FF;--color-primary-hover:#0044CC;--color-primary-light:#E8F0FE;--color-on-primary:#FFFFFF;
  --color-foreground:#080E32;--color-background:#FFFFFF;--color-surface:#F7F8FB;--color-muted:#F3F3F5;
  --color-muted-fg:#6B6E84;--color-border:#E6E7EA;--color-input-border:#8A8DA0;
  --color-success:#22C55E;--color-success-fg:#137A3A;--color-success-bg:#E9F9EF;--color-on-success:#062B14;
  --color-error:#E7000B;--color-error-fg:#B5000A;--color-error-bg:#FDECEC;--color-on-error:#FFFFFF;
  --color-warning:#F54A00;--color-warning-fg:#B83700;--color-warning-bg:#FFF1EA;
  --color-primary-fg:#0055FF;
  --overlay-bg:rgba(8,14,50,.72);--overlay-fg:#F2F4FA;
  --color-muted-fg-strong:#5A5D72;
  --chat-bg:#EEF1F7;--chat-in:#FFFFFF;--chat-out:#DCE8FF;--chat-meta:#5A5D72;
  --photo-a:#C9CFDE;--photo-b:#9AA3BA;--cam-bg:#111735;--cam-grid:rgba(255,255,255,.12);
  --cal-guest:#D9DBE3;--cal-guest-fg:#3F4258;
  --shadow-pop:0 12px 32px rgba(8,14,50,.18);--shadow-xs:0 1px 2px rgba(8,14,50,.12);--shadow-bar:0 -6px 20px rgba(8,14,50,.06);--shadow-msg:0 1px 0 rgba(8,14,50,.06);
  --radius-sm:4px;--radius-md:6px;--radius-lg:8px;--radius-xl:12px;--radius-2xl:16px;--radius-device:24px;--radius-full:9999px;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-6:24px;--space-8:32px;--space-12:48px;--space-16:64px;
  --ease:cubic-bezier(.22,1,.36,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --color-primary:#4D88FF;--color-primary-hover:#6B9DFF;--color-primary-light:#16245A;--color-on-primary:#060A24;
    --color-foreground:#E9ECF8;--color-background:#080E32;--color-surface:#0E1640;--color-muted:#141D4C;
    --color-muted-fg:#A2A8C6;--color-border:#26305F;--color-input-border:#5A6494;
    --color-success-fg:#5BE38D;--color-success-bg:#0F2E2A;--color-error:#FF5A5F;--color-error-fg:#FF8A8E;--color-error-bg:#3A1428;--color-on-error:#060A24;
    --color-warning:#FF7A3D;--color-warning-fg:#FF9A66;--color-warning-bg:#3A1E1E;--color-primary-fg:#8FB3FF;
    --chat-bg:#0B1238;--chat-in:#162054;--chat-out:#1D3478;--chat-meta:#B8BEDA;--photo-a:#2A3466;--photo-b:#3C4884;
    --color-muted-fg-strong:#B8BEDA;
    --cal-guest:#2A3466;--cal-guest-fg:#C4C9E2;--shadow-pop:0 12px 32px rgba(0,0,0,.5);
    --shadow-xs:0 1px 2px rgba(0,0,0,.4);--shadow-bar:0 -6px 20px rgba(0,0,0,.35);--shadow-msg:0 1px 0 rgba(0,0,0,.3);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --color-primary:#4D88FF;--color-primary-hover:#6B9DFF;--color-primary-light:#16245A;--color-on-primary:#060A24;
  --color-foreground:#E9ECF8;--color-background:#080E32;--color-surface:#0E1640;--color-muted:#141D4C;
  --color-muted-fg:#A2A8C6;--color-border:#26305F;--color-input-border:#5A6494;
  --color-success-fg:#5BE38D;--color-success-bg:#0F2E2A;--color-error:#FF5A5F;--color-error-fg:#FF8A8E;--color-error-bg:#3A1428;--color-on-error:#060A24;
  --color-warning:#FF7A3D;--color-warning-fg:#FF9A66;--color-warning-bg:#3A1E1E;--color-primary-fg:#8FB3FF;
  --chat-bg:#0B1238;--chat-in:#162054;--chat-out:#1D3478;--chat-meta:#B8BEDA;--photo-a:#2A3466;--photo-b:#3C4884;
  --color-muted-fg-strong:#B8BEDA;
  --cal-guest:#2A3466;--cal-guest-fg:#C4C9E2;--shadow-pop:0 12px 32px rgba(0,0,0,.5);
  --shadow-xs:0 1px 2px rgba(0,0,0,.4);--shadow-bar:0 -6px 20px rgba(0,0,0,.35);--shadow-msg:0 1px 0 rgba(0,0,0,.3);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--color-background);color:var(--color-foreground);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;font-size:14px;line-height:1.5;overflow-x:hidden}
h1,h2,h3,h4{margin:0}
/* escala Bluezone (seção 3); clamp só encolhe no celular, o teto é o do token */
h1,.h1{font-size:clamp(30px,6vw,48px);font-weight:700;line-height:1.1;letter-spacing:-.01em}
h2,.h2{font-size:clamp(22px,4vw,30px);font-weight:500;line-height:1.2}
h1.h2{font-weight:500;line-height:1.2;letter-spacing:0}
h3,.h3{font-size:clamp(20px,3.4vw,24px);font-weight:500;line-height:1.3}
h4,.h4{font-size:20px;font-weight:500;line-height:1.4}
.p-ui{font-size:16px;font-weight:700;line-height:1.6}
p{margin:0;max-width:68ch}
[hidden]{display:none!important}
.lead{font-size:clamp(18px,2.6vw,20px);font-weight:500;line-height:1.5;color:var(--color-muted-fg)}
.detail{font-size:12px;font-weight:500;line-height:1.4}
.muted{color:var(--color-muted-fg)}
.num{font-variant-numeric:tabular-nums}
a{color:var(--color-primary-fg)}
:focus-visible{outline:2px solid var(--color-primary);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:16px;top:-64px;z-index:80;background:var(--color-primary);color:var(--color-on-primary);padding:8px 16px;border-radius:var(--radius-full);text-decoration:none;font-weight:500}
.skip:focus{top:8px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.stack{display:flex;flex-direction:column;gap:var(--space-4)}
.row{display:flex;gap:var(--space-2);flex-wrap:wrap;align-items:center}
.between{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}

/* header */
.top{position:sticky;top:0;z-index:30;background:var(--color-background);border-bottom:1px solid var(--color-border)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;text-decoration:none;color:inherit}
.brand b{font-size:20px;font-weight:700;letter-spacing:-.01em}
.brand b span{color:var(--color-primary-fg)}
.brand small{font-size:12px;color:var(--color-muted-fg)}
.seal{font-size:12px;font-weight:500;color:var(--color-warning-fg);background:var(--color-warning-bg);border-radius:var(--radius-full);padding:3px 10px;white-space:nowrap}
.viewas{display:flex;align-items:center;gap:8px;padding-top:4px;padding-bottom:10px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.viewas::-webkit-scrollbar{display:none}
.viewas .lbl{font-size:12px;color:var(--color-muted-fg);white-space:nowrap}
.seg{display:inline-flex;background:var(--color-muted);border-radius:var(--radius-full);padding:3px;gap:2px;flex:0 0 auto}
.seg a{display:inline-block;text-decoration:none;font-weight:500;color:var(--color-muted-fg);padding:6px 12px;border-radius:var(--radius-full);cursor:pointer;white-space:nowrap}
.seg a:hover{color:var(--color-foreground)}
#howlink[aria-current="page"]{background:var(--color-primary-light)}
.seg a[aria-current="page"]{background:var(--color-background);color:var(--color-foreground);box-shadow:var(--shadow-xs)}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:4px 16px 10px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;text-decoration:none;color:var(--color-muted-fg);font-weight:500;padding:6px 14px;border-radius:var(--radius-full);white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.tab:hover{color:var(--color-foreground);background:var(--color-muted)}
.tab[aria-current="page"]{color:var(--color-primary-fg);background:var(--color-primary-light)}
.tab .cnt{font-size:12px;background:var(--color-warning-fg);color:var(--color-background);border-radius:var(--radius-full);padding:0 7px;line-height:18px}

/* buttons */
.btn{appearance:none;border:1px solid transparent;border-radius:var(--radius-full);font:inherit;font-weight:500;min-height:40px;padding:0 18px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;transition:background .2s var(--ease),color .2s var(--ease),border-color .2s var(--ease),transform .1s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--color-primary);color:var(--color-on-primary)}
.btn-primary:hover{background:var(--color-primary-hover)}
.btn-outline{background:transparent;color:var(--color-foreground);border-color:var(--color-border)}
.btn-outline:hover{border-color:var(--color-primary);color:var(--color-primary-fg)}
.btn-ghost{background:transparent;color:var(--color-primary-fg)}
.btn-ghost:hover{background:var(--color-primary-light)}
.btn-danger{background:transparent;color:var(--color-error-fg);border-color:var(--color-error)}
.btn-danger:hover{background:var(--color-error-bg)}
.btn-ok{background:var(--color-success);color:var(--color-on-success)}
.btn-sm{min-height:32px;padding:0 12px;font-size:13px}
.btn-lg{min-height:48px;padding:0 24px;font-size:16px}
.btn[disabled]{opacity:.5;cursor:not-allowed;transform:none}
.badge{display:inline-flex;align-items:center;gap:4px;border-radius:var(--radius-full);padding:2px 10px;font-size:12px;font-weight:500;background:var(--color-muted);color:var(--color-foreground);white-space:nowrap}
.badge.blue{background:var(--color-primary-light);color:var(--color-primary-fg)}
.badge.ok{background:var(--color-success-bg);color:var(--color-success-fg)}
.badge.warn{background:var(--color-warning-bg);color:var(--color-warning-fg)}
.badge.err{background:var(--color-error-bg);color:var(--color-error-fg)}

/* forms */
input[type=search],input[type=text],select,textarea{font:inherit;color:var(--color-foreground);background:var(--color-background);border:1px solid var(--color-input-border);border-radius:var(--radius-lg);min-height:44px;padding:10px 14px;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--color-primary);outline:2px solid var(--color-primary);outline-offset:1px}
textarea{min-height:80px;resize:vertical}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--color-primary);flex:0 0 auto}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-top:4px;padding-bottom:4px}
.chips::-webkit-scrollbar{display:none}
@media (min-width:720px){.chips{flex-wrap:wrap;overflow:visible}}
.chip{appearance:none;flex:0 0 auto;border:1px solid var(--color-border);background:var(--color-background);color:var(--color-foreground);font:inherit;font-weight:500;font-size:13px;padding:6px 12px;border-radius:var(--radius-full);cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--color-primary)}
.chip[aria-pressed="true"]{background:var(--color-foreground);color:var(--color-background);border-color:var(--color-foreground)}

/* layout */
main{padding:var(--space-8) 0 120px}
main:focus{outline:none}
.view.enter{animation:enter .4s var(--ease)}
@keyframes enter{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font-size:12px;font-weight:500;color:var(--color-primary-fg);margin-bottom:6px;letter-spacing:.02em}
.block{margin-top:var(--space-12)}
.block>h2,.block>.between{margin-bottom:var(--space-4)}
.panel{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:var(--space-4)}
@media (min-width:640px){.panel{padding:var(--space-6)}}
.grid2{display:grid;gap:var(--space-6)}
@media (min-width:900px){.grid2{grid-template-columns:minmax(0,7fr) minmax(0,5fr);align-items:start}}
.kv{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:6px 16px;margin:0}
.kv dt{color:var(--color-muted-fg)}
.kv dd{margin:0;text-align:right;font-weight:500;overflow-wrap:anywhere}
.hr{border:0;border-top:1px solid var(--color-border);margin:var(--space-4) 0}
.note{background:var(--color-primary-light);border-radius:var(--radius-lg);padding:12px 14px}
.note.warn{background:var(--color-warning-bg)}
.note.err{background:var(--color-error-bg)}
.note.ok{background:var(--color-success-bg)}
.note .muted,.fstep.live .muted{color:var(--color-muted-fg-strong)}
.empty{border:1px dashed var(--color-border);border-radius:var(--radius-xl);padding:24px 16px;text-align:center;color:var(--color-muted-fg)}

/* hero */
.hero{display:grid;gap:var(--space-6);align-items:end}
@media (min-width:860px){.hero{grid-template-columns:1.5fr 1fr}}
.next-slot{display:flex;flex-direction:column;gap:10px;border-top:2px solid var(--color-foreground);padding-top:14px}
.next-slot b.when{font-size:20px}

/* property list
   Exceção documentada (regra "botão = rounded-full"): .prop-pick, .kit, .pro, .day e .shot são
   cards/células selecionáveis feitos com <button> por acessibilidade de teclado; usam radius-lg/xl
   como card. Botões de ação (.btn, .chip, .period, .seg) seguem rounded-full. */
.props-wrap,.kits-wrap,.pros-wrap,.cal-wrap{container-type:inline-size}
.props{display:grid;gap:var(--space-3)}
@container (min-width:640px){.props{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}}
.prop{display:flex;flex-direction:column;gap:10px;border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:16px;background:var(--color-background)}
.prop .code{font-weight:700;font-size:16px}
.prop .meta{color:var(--color-muted-fg)}
.prop-pick{appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;width:100%}
.prop-pick:hover{border-color:var(--color-primary)}
.prop-pick[aria-pressed="true"]{border-color:var(--color-primary);box-shadow:0 0 0 1px var(--color-primary);background:var(--color-primary-light)}

/* kits */
.kits{display:grid;gap:var(--space-3)}
@container (min-width:520px){.kits{grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}}
.kit{display:flex;flex-direction:column;gap:8px;border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:16px;background:var(--color-background)}
.kit.season{background:var(--color-foreground);color:var(--color-background);border-color:var(--color-foreground)}
.kit.season .muted{color:color-mix(in srgb,var(--color-background) 70%,var(--color-foreground))}
.kit.season .btn-outline{color:var(--color-background);border-color:currentColor}
.kit.season .btn-primary{background:var(--color-background);color:var(--color-foreground)}
.kit.season :focus-visible{outline-color:var(--color-background)}
.kits-more summary{cursor:pointer;font-weight:500;color:var(--color-primary-fg);padding:8px 0}
.kit .price{font-size:24px;font-weight:700}
.kit ul{margin:0;padding-left:18px}
.kit.on{box-shadow:0 0 0 2px var(--color-primary)}

/* catalog */
.cat-list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:14px 0;border-bottom:1px solid var(--color-border);align-items:center}
.item .nm{font-weight:500}
.item .inc{grid-column:1/2;color:var(--color-muted-fg);font-size:13px}
.item .pr{font-weight:700;text-align:right}
.item .act{grid-column:2;grid-row:2;justify-self:end}
.qty{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--color-input-border);border-radius:var(--radius-full);padding:2px}
.qty button{appearance:none;border:0;background:transparent;width:30px;height:30px;border-radius:var(--radius-full);font:inherit;font-weight:700;cursor:pointer;color:var(--color-foreground)}
.qty button:hover{background:var(--color-muted)}
.qty span{min-width:20px;text-align:center;font-weight:700}

/* stepper */
.stepper{list-style:none;margin:0 0 var(--space-6);padding:4px 0 0;display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.stepper::-webkit-scrollbar{display:none}
.stepper li{flex:1 0 auto;min-width:64px;display:flex;flex-direction:column;gap:6px;font-size:12px;font-weight:500;color:var(--color-muted-fg)}
.stepper li::before{content:"";height:4px;border-radius:var(--radius-full);background:var(--color-muted)}
.stepper li.done::before,.stepper li.cur::before{background:var(--color-primary)}
.stepper li.cur{color:var(--color-foreground)}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--color-background);border-top:1px solid var(--color-border);box-shadow:var(--shadow-bar)}
.cartbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
.cartbar .tot{font-size:20px;font-weight:700}

/* pros */
.pros{display:grid;gap:var(--space-3)}
@container (min-width:760px){.pros{grid-template-columns:repeat(3,1fr)}}
.pro .nm{font-size:16px;font-weight:700}
.pro{appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:12px;border:1px solid var(--color-border);border-radius:var(--radius-xl);padding:16px;background:var(--color-background)}
.pro:hover{border-color:var(--color-primary)}
.pro[aria-pressed="true"]{border-color:var(--color-primary);box-shadow:0 0 0 1px var(--color-primary)}
.who{display:flex;gap:12px;align-items:center}
.av{width:48px;height:48px;border-radius:var(--radius-full);display:grid;place-items:center;font-weight:700;flex:0 0 auto;background:var(--color-primary-light);color:var(--color-primary-fg)}
.av.sm{width:34px;height:34px;font-size:12px}
.pro .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--color-border);padding-top:10px}
.pro .stats b{display:block;font-size:16px}
.pro .stats span{font-size:12px;color:var(--color-muted-fg)}
.star{color:var(--color-warning)}

/* calendar */
.calhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.calgrid .dow{font-size:12px;color:var(--color-muted-fg);text-align:center;padding:4px 0}
.day{appearance:none;font:inherit;border:1px solid var(--color-border);background:var(--color-background);color:var(--color-foreground);border-radius:var(--radius-lg);min-height:52px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;position:relative}
.day b{font-size:15px}
.day b small{font-size:12px;font-weight:500}
.day i{font-style:normal;font-size:12px;line-height:1.1;letter-spacing:-.02em;color:var(--color-muted-fg);text-align:center;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.day.free{border-color:var(--color-input-border)}
.day.free:hover{border-color:var(--color-primary)}
.day.free i{color:var(--color-success-fg)}
.day.half{border-color:var(--color-warning)}
.day.half i{color:var(--color-warning-fg)}
/* reservado: bloco sólido + hachura forte + número riscado (não depende do rótulo) */
.day.guest{background-color:var(--cal-guest);color:var(--cal-guest-fg);border-color:transparent;background-image:repeating-linear-gradient(135deg,transparent 0 5px,color-mix(in srgb,var(--cal-guest-fg) 38%,transparent) 5px 7px)}
.day.guest b{text-decoration:line-through;text-decoration-thickness:2px}
.day.guest b,.day.guest i{background:var(--cal-guest);border-radius:var(--radius-sm);padding:0 3px;color:var(--cal-guest-fg)}
/* folga: só contorno tracejado em fundo claro */
.day.off{background:var(--color-background);color:var(--color-muted-fg);border-style:dashed;border-color:var(--color-input-border)}
.day.past{background:transparent;color:var(--color-muted-fg);border-color:transparent;cursor:not-allowed}
.day.today{box-shadow:inset 0 0 0 2px var(--color-foreground)}
.day[aria-pressed="true"]{background:var(--color-primary);color:var(--color-on-primary);border-color:var(--color-primary)}
.day[aria-pressed="true"] i{color:var(--color-on-primary)}
@media (max-width:400px){.cal-panel{padding:var(--space-2)}.calgrid{gap:2px}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--color-muted-fg)}
.legend span{display:inline-flex;gap:6px;align-items:center}
.legend i{width:14px;height:14px;border-radius:var(--radius-sm);border:1px solid var(--color-input-border);display:inline-block}

/* disponibilidade do dia: imóvel × profissional (skip = pedido a ignorar na checagem de ocupado) */
function dayInfo(code, proId, n, skip){
  const im = imv(code);
  if(n<2) return {st:"past",why:"Antecedência mínima de 48h",short:"48h"};
  let checkout=false, checkin=false, inside=null;
  for(const [a,b] of im.res){
    if(n>a && n<b) inside=[a,b];
    if(n===b) checkout=true;
    if(n===a) checkin=true;
  }
  if(inside) return {st:"guest",why:`Reservado: hóspede no imóvel (reserva ${fmtD(inside[0])} a ${fmtD(inside[1])})`,short:"ocupado"};
  if(checkout && checkin) return {st:"guest",why:"Reservado: troca de hóspede no dia (check-out 11h e check-in 15h)",short:"ocupado"};
  if(checkin) return {st:"guest",why:"Reservado: dia de check-in, limpeza e entrada do hóspede às 15h",short:"ocupado"};
  if(proId){
    const p=pro(proId), d=addD(n);
    if(p.off.includes(d.getDay())||p.folgas.includes(n)) return {st:"off",why:`${p.nome} sem agenda neste dia`,short:"folga"};
    // pedido do ConcertAI já marcado no mesmo imóvel ou com o mesmo profissional ocupa o dia
    const busy=S.orders.find(o=>o.id!==skip&&o.dia===n&&o.status!=="cancelado"&&(o.imovel===code||o.pro===proId));
    if(busy) return {st:"guest",why:busy.imovel===code?`Ocupado: já tem o pedido ${busy.id} neste imóvel`:`Ocupado: ${p.nome} já tem outro serviço neste dia`,short:"ocupado"};
  }
  if(checkout) return {st:"half",why:"Dia de check-out: serviço só depois das 11h",short:"11h+",half:true};
  return {st:"free",why:"Livre entre reservas",short:"livre"};
}
function nextFree(code, proId, from, skip){
  for(let n=Math.max(2,from||2);n<=60;n++){ const i=dayInfo(code,proId,n,skip); if(i.st==="free"||i.st==="half") return n; }
  return null;
}

  const im=f.imovel?imv(f.imovel):{splits:1};

  for(const [c,q] of Object.entries(f.itens)){ const i=item(c); total+=i.preco*q; liq+=i.liq*q; }

function vFlow(buyer){
  const f=flowOf(buyer);

  const stepper=`<ol class="stepper" aria-label="Etapas">${labels.map((l,i)=>`<li class="${i+1<f.step?"done":i+1===f.step?"cur":""}" ${i+1===f.step?'aria-current="step"':""}>${i+1}. ${l}</li>`).join("")}</ol>`;
  const head=`<div class="between" style="margin-bottom:16px"><h1 class="h2" id="flow-h" tabindex="-1">${["","Para qual imóvel?","O que precisa ser feito?","Preço fechado. Escolha quem faz.","Escolha um dia livre entre reservas","Revise e confirme"][f.step]}</h1>${f.step>1?`<button class="btn btn-ghost btn-sm" data-back="${buyer}">Voltar</button>`:""}</div>`;
  let body="";
  if(f.step===1) body=stepImovel(f);
  if(f.step===2) body=stepServicos(f);
  if(f.step===3) body=stepPro(f);
  if(f.step===4) body=stepData(f);
  if(f.step===5) body=stepConfirma(f);
  return stepper+head+body;
}

function catLista(f){
  const q=f.q.trim().toLowerCase();
  let lista=ITENS.filter(i=>i.cod!=="DG-01");
  if(!q) return f.cat?lista.filter(i=>i.cat===f.cat):lista;
  // aceita palavras de 2 letras ("ar", "tv"); curtas só batem com a palavra inteira
  const toks=q.split(/\s+/).filter(t=>t.length>=2&&!STOP.has(t));
  if(!toks.length) return [];
  return lista.filter(i=>(i.nome+" "+i.kw+" "+catName(i.cat)).toLowerCase().split(/[\s,()/"]+/).some(w=>toks.some(t=>t.length<=3?w===t:w.startsWith(t.slice(0,t.length-1)))));
}

  const lista=catLista(f), q=f.q.trim();

function renderCartbar(buyer){
  const f=flowOf(buyer); if(f.done||f.step===1&&!f.imovel) { if(f.step!==1||f.done) return; }
  const {total,n}=flowTotals(f);
  let canNext=false, label="Continuar";
  if(f.step===1) canNext=!!f.imovel;
  if(f.step===2) canNext=n>0;
  if(f.step===3) canNext=!!f.pro;
  if(f.step===4) canNext=f.dia!==null&&!!f.per;
  if(f.step===5) return;
  // botão bloqueado diz o que falta
  if(!canNext) label=["","Escolha um imóvel","Adicione um serviço","Escolha um profissional",f.dia===null?"Escolha um dia":"Escolha o período"][f.step];
  $("#cartbar").innerHTML=`<div class="cartbar"><div class="wrap">
    <div><div class="detail muted">${f.step===1?(f.imovel?imvLabel(imv(f.imovel)):"Escolha um imóvel"):`${n} ${n===1?"item":"itens"}`}</div>${f.step>1?`<div class="tot num">${brl(total)}</div>`:""}</div>
    <button class="btn btn-primary btn-lg" data-next="${buyer}" ${canNext?"":"disabled"}>${label}</button></div></div>`;
}

function orderCard(o,buyer){

    ${o.protocolo?`<div class="note"><b>Protocolo ${o.protocolo}</b> · reclamação aberta na SIA. 1ª resposta em até 1 dia útil.</div>`:""}

/* ============ EXTRATO ============ */
function lancamentos(){
  const out=[];
  for(const o of S.orders.filter(o=>imv(o.imovel).dono==="eu"&&o.status==="ok")){
    const two=ehParcelado(o);
    const quem=o.buyer==="prop"?"você":FRANQUIA;
    if(two){ const [a,b]=parc2(o.total); out.push({o,quem,mes:repasseMes(o.dia),v:a,parc:"1/2",prev:o.step<4}); out.push({o,quem,mes:repasseMes2(o.dia),v:b,parc:"2/2",prev:true}); }
    else out.push({o,quem,mes:repasseMes(o.dia),v:o.total,parc:"",prev:o.step<4});
  }
  return out;
}
function vExtrato(){
  const L=lancamentos();
  const meses=[...new Set(L.map(l=>l.mes))];
  const ord=m=>{const [n,y]=m.split("/");return +y*12+MES.indexOf(n);};
  meses.sort((a,b)=>ord(a)-ord(b));
  return `<h1 class="h2" style="margin-bottom:8px">Extrato no repasse</h1>
  <p class="muted" style="margin-bottom:24px">Cada serviço aparece numa linha só, como despesa do repasse, com quem pediu. Nada é cobrado no cartão.</p>
  <div class="stack">${meses.map(m=>{const ls=L.filter(l=>l.mes===m);return `
    <div class="panel"><div class="between" style="margin-bottom:8px"><h3>Repasse de ${m}</h3>${ls.some(l=>l.prev)?`<span class="badge">Previsto</span>`:`<span class="badge ok">Lançado</span>`}</div>
    <table class="ledger"><thead><tr><th>Serviço</th><th>Valor</th></tr></thead><tbody>
    ${ls.map(l=>`<tr><td><b>${orderTitle(l.o)}</b>${l.parc?` · parcela ${l.parc}`:""}<br><span class="detail muted">${l.o.id} · ${l.o.imovel} · ${fmtD(l.o.dia)} · pedido por ${l.quem}${l.prev?" · previsto":""}</span></td><td class="num">− ${brl(l.v)}</td></tr>`).join("")}
    </tbody><tfoot><tr><td>Total do mês</td><td class="num">− ${brl(ls.reduce((a,l)=>a+l.v,0))}</td></tr></tfoot></table></div>`;}).join("")}</div>`;
}

function excAction(id,a){
  const e=S.exc.find(x=>x.id===id); const t=new Date().toTimeString().slice(0,5);
  const po=S.orders.find(o=>o.id===e.pedido&&o.status==="reescolha");
  if(a==="opts"&&po){
    // mesmas regras do "Escolha como seguir": cobre as categorias e está livre na data
    const livres=PROS.filter(p=>p.id!==po.pro&&orderCats(po).every(c=>p.cats.includes(c))&&!(p.novo&&po.total>300)&&["free","half"].includes(dayInfo(po.imovel,p.id,po.dia,po.id).st)).slice(0,2);
    const nd=nextFree(po.imovel,po.pro,po.dia+1,po.id);
    e.opts=[...livres.map(p=>`${p.nome} em ${fmtD(po.dia)}`),...(nd!==null?[`${pro(po.pro).nome} em ${fmtD(nd)}`]:[])];
    e.log.push(`${t} Exceções montou as opções, enviadas por botão em 10 min`);
  }
  else if(a==="opts"){ e.opts= id==="x1"?["Rafaela S. hoje 14h às 17h","Tânia F. em "+fmtD(3)]:["Marcos T. em "+fmtD(9),"Diego A. em "+fmtD(9),"Outra data"]; e.log.push(`${t} Exceções montou as opções, enviadas por botão em 10 min`); }
  else if(a==="humano"){ e.done=true; e.log.push(`${t} Escalado para humano (EXCECAO_HUMANA)`); }
  else if(a==="hospede"){ e.done=true; e.log.push(`${t} SIA pediu consentimento ao hóspede · hóspede aceitou a janela de 30 min`); }
  else if(a==="novadata"){ e.opts=[fmtD(14)+" manhã",fmtD(15)+" tarde",fmtD(16)+" manhã"]; e.log.push(`${t} Comprador recebeu as próximas datas livres`); }
  else if(a==="cancelar"){ e.done=true; e.log.push(`${t} CANCELADO_SEM_APROVACAO · data liberada · franquia avisada`); }
  else if(a==="cs"){ e.done=true; e.log.push(`${t} CS Proprietários assumiu (item urgente do MGO)`); }
  else if(a==="retrabalho"){ e.opts=[fmtD(2)+" tarde",fmtD(3)+" manhã"]; /* dentro das 72h da garantia */ e.log.push(`${t} Jonas P. aceitou o retrabalho; comprador escolhe a data`); }
  else if(a==="estorno"){ e.done=true; e.log.push(`${t} Estorno de R$ 160 no repasse (dentro da alçada)`); }
  else if(a==="responder"){ e.done=true; e.log.push(`${t} Resposta enviada com histórico e fotos · protocolo segue aberto até o cliente confirmar`); }
  renderKeep(`#exc-${id}`); toast("Ação registrada no histórico do pedido");
}

// região viva fixa no HTML: só troca o texto, então o leitor de tela anuncia
let toastT=null;
function toast(t){ const el=$("#toasts"); el.textContent=""; clearTimeout(toastT); requestAnimationFrame(()=>{ el.textContent=t; }); toastT=setTimeout(()=>{ el.textContent=""; },2800); }
function announce(t){ const el=$("#live"); el.textContent=""; requestAnimationFrame(()=>{ el.textContent=t; }); }
// modal: guarda quem abriu, fundo inert, Tab preso no .sheet, foco volta ao fechar
let sheetOpener=null;
const BG=["header.top","main","#cartbar"];
function sheet(html){
  if(!$("#layer").innerHTML) sheetOpener=document.activeElement;
  $("#layer").innerHTML=`<div class="scrim" data-close><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sh-t">${html}</div></div>`;
  BG.forEach(s=>{ const n=$(s); n&&n.setAttribute("inert",""); });
  const f=$("#layer .sheet [autofocus]")||$("#layer .sheet button"); f&&f.focus();
}
function closeSheet(){
  if(!$("#layer").innerHTML) return;
  $("#layer").innerHTML="";
  BG.forEach(s=>{ const n=$(s); n&&n.removeAttribute("inert"); });
  const o=sheetOpener; sheetOpener=null;
  if(o&&document.contains(o)) o.focus(); else $("#main").focus({preventScroll:true});
}
function trapTab(ev){
  const sh=$("#layer .sheet"); if(!sh||ev.key!=="Tab") return;
  const els=[...sh.querySelectorAll('button:not([disabled]),textarea,input,select,a[href],[tabindex]:not([tabindex="-1"])')];
  if(!els.length) return;
  const first=els[0], last=els[els.length-1];
  if(ev.shiftKey&&(document.activeElement===first||!sh.contains(document.activeElement))){ ev.preventDefault(); last.focus(); }
  else if(!ev.shiftKey&&(document.activeElement===last||!sh.contains(document.activeElement))){ ev.preventDefault(); first.focus(); }
}

/* ============ EVENTOS ============ */
document.addEventListener("click",ev=>{
  const b=ev.target.closest("button,[data-close]"); if(!b) return;
  const d=b.dataset;
  if("close" in d && (b.tagName==="BUTTON"||ev.target===b)){ closeSheet(); return; }
  if(d.go){ go(d.go); return; }
  if(d.buy){ const f=S.flows[d.buy]=newFlow(d.buy); if(d.im){ f.imovel=d.im; f.step=2; } if(d.k){ f.kit=d.k; f.step=3; }
    // sugestão da carteira: item e profissional já vêm preenchidos, cai direto na data
    if(d.it){ f.itens[d.it]=1; f.step=3; if(d.p&&rankPros(f).some(x=>x.p.id===d.p)){ f.pro=d.p; f.step=4; } }
    go(`#/${d.buy==="prop"?"proprietario":"franquia"}/contratar`); return; }
  if(d.novo){ S.flows[d.novo]=newFlow(d.novo); render(); focusFlow(); return; }
  // fluxo
  const buyer=route().perfil.k==="franquia"?"fra":"prop"; const f=S.flows[buyer];
  if(d.pickIm){ f.imovel=d.pickIm; f.pro=null; f.dia=null; f.per=null; renderKeep(); return; }
  if(d.next){ const g=flowOf(d.next); g.step++; g.msg=""; if(g.step===3){ g.pro=null; } if(g.step===4){ g.dia=null; g.per=null; } render(); window.scrollTo(0,0); focusFlow(); return; }
  if(d.back){ const g=flowOf(d.back); g.step--; render(); focusFlow(); return; }
  if(d.kit){ f.kit=f.kit===d.kit?null:d.kit; renderKeep(); return; }
  if(d.q){ const c=d.q; f.itens[c]=Math.max(0,Math.min(9,(f.itens[c]||0)+(+d.d))); if(!f.itens[c]) delete f.itens[c];
    const fb=`[data-q="${c}"]`; renderKeep(fb); announce(`${item(c).nome}: ${f.itens[c]||0} no pedido`); return; }
  if(d.cat!==undefined&&b.classList.contains("chip")&&f&&f.step===2){ f.cat=d.cat; f.q=""; renderKeep(); return; }
  // trocar o profissional zera data, período e mensagem
  if(d.pro){ if(f.pro!==d.pro){ f.dia=null; f.per=null; f.msg=""; } f.pro=d.pro; renderKeep(); return; }
  if(d.day){ const n=+d.day, di=dayInfo(f.imovel,f.pro,n);
    if(b.getAttribute("aria-disabled")==="true"){
      f.msg=`<b>${fmtDL(n)} não está disponível.</b> ${di.why}.${f.dia!==null?` Sua data continua sendo ${fmtDL(f.dia)}.`:""}`;
      const r=$("#reason"); if(r){ r.innerHTML=f.msg; r.scrollIntoView({block:"nearest",behavior:"smooth"}); } return; }
    f.dia=n; if(di.half&&f.per==="manha") f.per=null; f.msg=`<b>${fmtDL(n)}</b> · ${di.why}.`; renderKeep(); return; }
  if(d.per){ f.per=d.per; renderKeep(); return; }
  if(b.id==="confirmar"){ confirmar(buyer); return; }
  // pedidos
  if(d.aprov){ const o=S.orders.find(x=>x.id===d.aprov); o.status="ok"; o.step=0; S.prest=o.pro; renderKeep("#done-h, #main"); toast(`Aprovado. ${pro(o.pro).nome} recebeu o pedido e a franquia foi avisada.`); return; }
  if(d.recusa){ const o=S.orders.find(x=>x.id===d.recusa); o.status="cancelado"; o.motivo="Recusado pelo proprietário"; renderKeep("#done-h, #main"); toast("Recusado. Data liberada e franquia avisada com o motivo."); return; }
  if(d.adv){ const o=S.orders.find(x=>x.id===d.adv); o.step=Math.min(4,o.step+1); renderKeep(`[data-sia="${o.id}"]`); return; }
  if(d.cancel){ const o=S.orders.find(x=>x.id===d.cancel); o.status="cancelado"; o.motivo="Cancelado sem custo"; closeSheet(); renderKeep("#main"); toast("Cancelado sem custo. Profissional e franquia avisados."); return; }
  if(d.star){ const o=S.orders.find(x=>x.id===d.star); const nk=buyer==="fra"?"notaFra":"notaProp"; o[nk]=+d.n; o.step=5; renderKeep(`[data-adv="${o.id}"], [data-sia="${o.id}"], #main`); toast("Obrigado. Nota registrada no perfil do profissional."); return; }
  if(d.sia){ siaSheet(S.orders.find(x=>x.id===d.sia)); return; }
  if(d.mot){ b.parentElement.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b)); return; }
  if(d.siasend){ const o=S.orders.find(x=>x.id===d.siasend); const prot="SIA-2026-"+(1000+S.sia.length+13); const cat=($("#layer .chip[aria-pressed=true]")||{}).dataset?.mot||"Qualidade"; const txt=($("#siatxt").value||"Sem descrição").slice(0,280);
    o.protocolo=prot; S.sia.unshift({prot,cat,txt});
    S.exc.unshift({id:"s"+Date.now(),tipo:"Reclamação SIA",sev:"warn",pedido:o.id,ctx:`${o.imovel} · ${orderTitle(o)} · ${prot} (${cat.toLowerCase()}). Prazo de 1ª resposta: 1 dia útil.`,regra:"D8 · Resolve na alçada (retrabalho ou estorno) ou escala CS Proprietários.",acoes:[["responder","Responder com histórico"],["humano","Escalar CS Proprietários"]],log:[`Aberta agora pel${buyer==="fra"?"a franquia":"o proprietário"}`]});
    closeSheet(); renderKeep(); toast(`Protocolo ${prot} aberto na SIA`); return; }
  if(d.reesc){ reescSheet(S.orders.find(x=>x.id===d.reesc)); return; }
  if(d.reescPick){ const o=S.orders.find(x=>x.id===d.reescPick); o.pro=d.p; if(d.nd) o.dia=+d.nd; o.status="ok"; o.step=0;
    // fecha a exceção "Prestador recusou" do mesmo pedido
    S.exc.filter(e=>e.pedido===o.id&&!e.done).forEach(e=>{ e.done=true; e.log.push(`Comprador escolheu: ${pro(o.pro).nome} em ${fmtD(o.dia)}`); });
    closeSheet(); renderKeep("#main"); toast("Novo pedido enviado ao profissional escolhido"); return; }
  // franquia
  if(d.ciente){ S.ciente[d.ciente]="ok"; renderKeep(`[data-ciente], [data-problema], #main`); return; }
  if(d.problema){ const o=S.orders.find(x=>x.id===d.problema); S.ciente[o.id]="prob"; S.exc.unshift({id:"f"+Date.now(),tipo:"Franquia sinalizou problema",sev:"warn",pedido:o.id,ctx:`${o.imovel} · ${orderTitle(o)} em ${fmtD(o.dia)}: franquia tocou "Tem um problema" na notificação.`,regra:"Notificador abre conversa com a franquia; se for acesso, vira D3.",acoes:[["responder","Falar com a franquia"],["humano","Escalar para humano"]],log:["Aberta agora pela franquia"]}); renderKeep(`[data-ciente], [data-problema], #main`); toast("Enviado ao painel interno"); return; }
  if(b.id==="cp"){ S.carteiraProb=!S.carteiraProb; renderKeep(); return; }
  // prestador
  if(d.pacc){ const o=S.orders.find(x=>x.id===d.pacc); o.step=1; renderKeep(`[data-pwa="${o.id}"], #chat`); toast("Confirmado. Comprador e franquia avisados."); return; }
  if(d.presenca){ const o=S.orders.find(x=>x.id===d.presenca); o.presenca=true; renderKeep(`[data-pwa="${o.id}"], #chat`); toast("Presença confirmada. A franquia foi avisada."); return; }
  if(d.prec){ const o=S.orders.find(x=>x.id===d.prec); o.status="reescolha"; S.exc.unshift({id:"r"+Date.now(),tipo:"Prestador recusou",sev:"warn",pedido:o.id,ctx:`${o.imovel} · ${orderTitle(o)} · ${pro(o.pro).nome} tocou "Não posso". Recusa sem punição.`,regra:"C1 → D1 · Comprador escolhe outro profissional ou outra data por botão.",acoes:[["opts","Enviar opções ao comprador"]],log:["Recusa registrada"]}); renderKeep("#chat"); toast("Recusado sem penalidade. O comprador vai reescolher."); return; }
  if(d.pwa){ S.pwa=d.pwa; renderKeep(); const g=$('[data-gps], [data-pwaclose]'); g&&g.focus({preventScroll:true}); if(window.innerWidth<900) setTimeout(()=>$(".pwa")&&$(".pwa").scrollIntoView({behavior:"smooth"}),50); return; }
  if("pwaclose" in d){ const id=S.pwa; S.pwa=null; renderKeep(`[data-pwa="${id}"], #chat`); return; }
  // cada etapa do link confere a anterior (além do inert na tela)
  if(d.gps){ S.pwaSt[d.gps].gps=true; const o=S.orders.find(x=>x.id===d.gps); o.step=Math.max(o.step,2); renderKeep(`[data-shot="antes"]`); return; }
  if(d.shot){ const st=S.pwaSt[d.o]; const o=S.orders.find(x=>x.id===d.o);
    const ck=o.kit?kit(o.kit).itens(imv(o.imovel)):o.itens;
    if(d.shot==="antes"&&!st.gps) return;
    if(d.shot==="depois"&&!(st.antes&&ck.every((_,i)=>st.ck[i]))) return;
    st[d.shot]=true; if(d.shot==="depois") o.step=Math.max(o.step,3);
    renderKeep(d.shot==="antes"?`[data-ck="0"]`:`[data-nf]`); return; }
  if(d.aditivo){ const st=S.pwaSt[d.aditivo]; if(!st.antes) return; st.aditivo=true; renderKeep(`[data-ck="0"]`); toast("Aditivo enviado. O comprador aprova o item extra por botão, com preço do catálogo."); return; }
  if(d.nf){ const st=S.pwaSt[d.nf]; if(!st.depois) return; st.nf=true; renderKeep(`[data-prova]`); toast("NF recebida."); return; }
  if(d.prova){ const st=S.pwaSt[d.prova]; if(!st||!st.nf) return; const o=S.orders.find(x=>x.id===d.prova); o.step=4;
    o.pixRetido=!S.sw.PAGAMENTOS_ENABLED;
    renderKeep(`[data-pwaclose]`); toast(o.pixRetido?`QA aprovou. Pix de ${brl(o.liq)} na fila: PAGAMENTOS_ENABLED está desligado.`:`QA aprovou. Pix de ${brl(o.liq)} enviado.`); return; }
  // painel
  if(d.exc){ excAction(d.exc,d.a); return; }
  if(d.esc){ const e=S.exc.find(x=>x.id===d.esc); const esc0=e.opts[+d.i]; e.done=true; e.log.push(`Comprador escolheu: ${esc0}`);
    // aplica a escolha no pedido, se ele existe no protótipo
    const o=S.orders.find(x=>x.id===e.pedido);
    if(o&&o.status==="reescolha"){ const p=PROS.find(x=>esc0.startsWith(x.nome)); if(p) o.pro=p.id; const m=esc0.match(/(\d{2})\/(\d{2})/); if(m){ for(let n=0;n<=60;n++){ if(fmtD(n)===m[0]){ o.dia=n; break; } } } o.status="ok"; o.step=0; }
    renderKeep(`#exc-${e.id}`); toast("Reagendado com a escolha do comprador"); return; }
  if(d.sw){ S.sw[d.sw]=!S.sw[d.sw]; renderKeep(); return; }
  if(b.id==="sim"){ runSim(); return; }
});
document.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="termos"){ const f=flowOf(route().perfil.k==="franquia"?"fra":"prop"); f.termos=t.checked; $("#confirmar").disabled=!t.checked; }
  if(t.id==="parcelar"){ const f=flowOf(route().perfil.k==="franquia"?"fra":"prop"); f.parcelar=t.checked; renderKeep(); }
  if(t.id==="cc"){ S.carteiraCidade=t.value; renderKeep(); }
  if(t.id==="psel"){ S.prest=t.value; S.pwa=null; renderKeep(); }
  if(t.dataset.ck!==undefined){ const st=S.pwaSt[t.dataset.o]; if(!st.antes){ t.checked=false; return; } st.ck[t.dataset.ck]=t.checked; renderKeep(); }
});
document.addEventListener("input",ev=>{
  const t=ev.target;
  // busca: atualiza só a lista e a contagem (sem re-render da tela, sem piscar)
  if(t.id==="busca"){ const f=flowOf(route().perfil.k==="franquia"?"fra":"prop"); f.q=t.value; const q=f.q.trim();
    $("#catlist").innerHTML=catListHTML(f); $("#catcount").textContent=catCount(f);
    document.querySelectorAll('.chips [data-cat]').forEach(c=>c.setAttribute("aria-pressed",String(!q&&(c.dataset.cat===f.cat)))); }
  if(t.id==="cq"){ S.carteiraQ=t.value; const pos=t.selectionStart; renderKeep(); const n=$("#cq"); n.focus(); n.setSelectionRange(pos,pos); }
});
document.addEventListener("keydown",ev=>{
  if(ev.key==="Escape"&&$("#layer").innerHTML){ closeSheet(); return; }
  if(ev.key==="Tab"&&$("#layer").innerHTML){ trapTab(ev); return; }
  // nota: radiogroup com setas
  const r=ev.target.closest&&ev.target.closest('.stars [role="radio"]');
  if(r&&["ArrowRight","ArrowLeft","ArrowUp","ArrowDown"].includes(ev.key)){
    ev.preventDefault(); const all=[...r.parentElement.children]; const i=all.indexOf(r);
    const j=(i+(ev.key==="ArrowRight"||ev.key==="ArrowDown"?1:-1)+all.length)%all.length;
    all.forEach((x,k)=>{ x.tabIndex=k===j?0:-1; x.setAttribute("aria-checked",String(k===j)); x.classList.toggle("on",k<=j); }); all[j].focus();
  }
});
document.addEventListener("toggle",ev=>{ if(ev.target.classList&&ev.target.classList.contains("kits-more")){ const f=S.flows[route().perfil.k==="franquia"?"fra":"prop"]; if(f) f.kitsOpen=ev.target.open; } },true);
document.addEventListener("focusin",ev=>{ if(ev.target.matches&&ev.target.matches(".stars [role=radio]")){ const all=[...ev.target.parentElement.children], j=all.indexOf(ev.target); all.forEach((x,k)=>x.classList.toggle("on",k<=j)); } });
function focusFlow(){ const h=$("#flow-h")||$("#done-h"); h&&h.focus({preventScroll:true}); }
// re-render mantendo rolagem e foco; fb = seletores de reserva quando o elemento focado some
function renderKeep(fb){
  const y=window.scrollY; const a=document.activeElement;
  let sel="";
  if(a&&a!==document.body){ if(a.id) sel="#"+CSS.escape(a.id); else if(a.dataset&&Object.keys(a.dataset).length) sel=Object.entries(a.dataset).map(([k,v])=>`[data-${k.replace(/[A-Z]/g,m=>"-"+m.toLowerCase())}="${CSS.escape(v)}"]`).join(""); }
  render(); window.scrollTo(0,y);
  const tries=[sel,...String(fb||"").split(",").map(s=>s.trim())].filter(Boolean);
  for(const s of tries){ try{ const n=document.querySelector(s); if(n){ n.focus({preventScroll:true}); return; } }catch(e){} }
  if(a&&a!==document.body) $("#main").focus({preventScroll:true});
}
render();
</script>
